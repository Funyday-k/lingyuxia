- date: '2026-11-09'
  papers:
  - link: https://arxiv.org/pdf/2611.07426v1
    title: First broadband search for fixed-polarization dark photon dark matter with GigaBREAD
    authors: Jialin Yu, Stefan Knirck, Gabe Hoshino, Rakshya Khatiwada, Alex Lapuente, David W. Miller, Andrew Sonnenschein
    affiliations: IIT, Chicago; Fermilab; Harvard U.; Chicago U.; Chicago U., EFI; Chicago U., KICP; Boston U.
    abstract: We present the first search for fixed-polarization dark photon (DP) dark matter in the 44-52$μ\mathrm{eV}$ mass
      range, corresponding to 10.7-12.5GHz. GigaBREAD is a room-temperature broadband dish antenna experiment in which DP
      convert to ordinary photons on a cylindrical metallic emission surface and are focused onto a radio-frequency receiver.
      Previous searches, including GigaBREAD and several other dish antenna searches, have assumed randomly polarized DP dark
      matter. However, vector dark matter produced by a misalignment-like mechanism may retain an approximately fixed polarization,
      leading to sidereal modulation of the detector response as the Earth rotates. We reanalyze the GigaBREAD data using
      a polarization-matched likelihood that accounts for the time-dependent projection of a fixed DP polarization onto the
      detector axis. We find no evidence for a fixed-polarization DP signal and set upper limits on the kinetic mixing parameter
      at the level of $χ\sim10^{-12}$. These limits are about $20\%$ better than a naive limit obtained by rescaling the previous
      GigaBREAD limit under the fixed-polarization assumption.

- date: '2026-11-10'
  papers:
  - link: https://arxiv.org/pdf/2611.09488v1
    title: Constraints on Cosmic-Rays and the MeV Emission from Jupiter's Atmosphere
    authors: Dimitris Tsatsis, Thomas Siegert, Volodymyr Savchenko, Saurabh Mittal, Laura Eisenberger, Mika A. Gelowicz, Rudi
      Reinhardt, Manja L. Zimmerer, Tristan Bouchet, Tomohiko Oka, Manuel R. H. W. Skalka
    affiliations: Julius-Maximilians-Universität Würzburg; University of Geneva; Rheinische Friedrich-Wilhelms-Universität
      Bonn
    abstract: The Cosmic $γ$-ray Background (CGB) in the MeV regime remains among the least understood components of diffuse
      cosmic radiation, primarily due to instrumental limitations in detecting faint isotropic emission at MeV energies. We
      present an indirect method for probing isotropic emission from soft X-rays to $γ$-rays through scattered emission in
      Jupiter's atmosphere. Using archival observations from SPI, the spectrometer aboard INTEGRAL, spanning 22 years of serendipitous
      Jupiter observations, we analyse the planet as a moving $γ$-ray point source in the 30 keV to 8 MeV range. Our analysis
      focuses on Jupiter's $γ$-ray albedo, produced by high-energy photon and cosmic-ray interactions. We performed detailed
      Monte Carlo simulations to model the response of Jupiter's atmosphere to incident photons, protons, electrons, positrons,
      and alpha particles. We simulate a 1000 km deep spherical atmosphere with 1 km shell resolution, based on Galileo probe
      measurements. By comparing empirical and astrophysical models with the SPI data, we find no statistically significant
      emission from Jupiter. We derive $2σ$ upper limits across the 30 keV to 8 MeV band, which we compare with cutoff power-law,
      reflected CGB, cosmic-ray-induced, and long-lived mediator dark matter models. We constrain Jupiter's bremsstrahlung
      luminosity in the MeV range to $10^{18}$ erg/s, close to that inferred from in situ measurements obtained by Juno/JEDI.
      While the expected emission from the CGB and cosmic rays is a factor of $10^4$ and 100 below our upper limits, respectively,
      this work establishes planetary atmospheres as promising indirect probes of diffuse $γ$-ray backgrounds for future MeV
      missions.

- date: '2026-11-11'
  papers:
  - link: https://arxiv.org/pdf/2611.13090v1
    title: First constraints on axion-like particles with SPHEREx data
    authors: Connor Hainje, Elena Pinetti, David W. Hogg
    affiliations: New York University; Flatiron Institute; Max Planck Institute for Astronomy
    abstract: We present the first search for axion-like particle dark matter using SPHEREx data. We perform a conservative
      analysis on the first 16.5 months of SPHEREx data and derive new limits on the mass range $0.496 < m_a < 3.32\,\mathrm{eV}$
      that are competitive with the literature. Our tightest limit on the coupling relative to those previously published
      is $g_{aγγ} < 2.10 \times 10^{-11}\,\mathrm{GeV}^{-1}$ at $m_a = 0.606\,\mathrm{eV}$, with a median limit of $g_{aγγ}
      < 4.16 \times 10^{-11}\,\mathrm{GeV}^{-1}$. Cast as model-independent limits on the lifetime of the dark matter particle,
      the median limit is $τ> 6.5 \times 10^{25}\,\mathrm{s}$. We are also able to detect several expected emission features
      at high significance, such as atmospheric He I and the 3.3 $μ$m PAH feature. We calculate the Cramér-Rao bound and compare
      to sensitivity forecasts, finding that our limits could be improved by more than an order of magnitude with solely methodological
      improvements.

