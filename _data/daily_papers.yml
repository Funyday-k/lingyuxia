      P. Desiati, N. Di Lalla, R. Diaz Hernandez, M. A. DuVernois, J. C. Díaz-Vélez, K. Engel, T. Ergin, C. Espinoza, N. Fraija,
      S. Fraija, A. Galván-Gámez, J. A. García-González, F. Garfias, N. Ghosh, A. Gonzalez Muñoz, M. M. González, J. A. González,
      J. A. Goodman, J. Gyeong, J. P. Harding, S. Hernández-Cadena, I. Herzog, D. Huang, F. Hueyotl-Zahuantitla, P. Hüntemeyer,
      A. Iriarte, S. Kaufmann, D. Kieda, K. Leavitt, W. H. Lee, J. Lee, H. León Vargas, J. T. Linnemann, A. L. Longinotti,
      G. Luis-Raya, C. Lundy, K. Malone, O. Martinez, J. Martínez-Castro, H. Martínez-Huerta, J. A. Matthews, P. Miranda-Romagnoli,
      P. E. Mirón-Enriquez, J. A. Morales-Soto, E. Moreno, M. Mostafá, M. Najafi, A. Nayerhoda, L. Nellen, M. U. Nisa, R.
      Noriega-Papaqui, N. Omodei, E. Ponce, Y. Pérez Araujo, E. G. Pérez-Pérez, C. D. Rho, A. Rodriguez Parra, D. Rosa-González,
      M. Roth, H. Salazar, D. Salazar-Gallegos, A. Sandoval, M. Schneider, J. Serna-Franco, M. Shin, A. J. Smith, Y. Son,
      R. W. Springer, O. Tibolla, K. Tollefson, I. Torres, R. Torres-Escobedo, F. Ureña-Mena, E. Varela, L. Villaseñor, X.
      Wang, Z. Wang, I. J. Watson, H. Wu, S. Yu, X. Zhang, H. Zhou
    affiliations: ''
    abstract: Understanding dark matter's elusive nature is crucial for the framework of particle physics and expanding the
      Standard Model. This analysis utilizes the High Altitude Water Cherenkov (HAWC) gamma ray Observatory to indirectly
      search for dark matter (DM) by studying gamma ray emission from dwarf spheroidal galaxies (dSphs). Selected for their
      high ratio of dark matter to baryonic matter, dSphs are useful for this type of search owing to the low background emission.
      In comparison to previous HAWC studies, we significantly improve our sensitivity to DM from dSphs due to improvements
      to our event reconstruction and reduced hadronic contamination. We expanded the number of dSphs studied, DM annihilation
      channels into the Standard Model (SM), and the amount of data collected on each previously studied dSph. We searched
      for DM signals in each dSph using the latest version of the algorithms used to reconstruct data from the primary detector
      of the HAWC instrument. We report that we do not detect evidence of DM from dSphs, so we place upper limits for the
      velocity-weighted DM annihilation cross-section ($\langleσv \rangle$) on the order of $10^{-23}~\text{cm}^3\text{s}^{-1}$
      for a DM mass range of $1-10^4$ TeV.
    comment: New results from HAWC, very impressive and competitive with other indirect detection experiments.
- date: '2026-04-24'
  papers:
  - link: https://arxiv.org/pdf/2604.21652v1
    title: Constraining dark matter self-interaction from kinetic heating in neutron stars
    authors: Sambo Sarkar
    affiliations: IISER, Berhampur; Jeonbuk Natl. U.
    abstract: Dark matter search strategies have started advancing towards the neutrino fog. In this regard, compact objects
      such as neutron stars have already demonstrated their ability in probing such low DM-nucleon cross-sections from dark
      matter induced effects. In the optically thin limit, effect of dark matter self-interaction becomes relevant and may
      assist the capture and thermalization of dark matter inside stars, imparting observable changes on neutron star temperatures.
      The resulting radiation although weak can be potentially detected by the James Webb Space Telescope and upcoming Thirty
      Meter Telescope and the European Extremely Large Telescope. Observation of cold neutron stars accompanied by advancements
      in direct detection probes would provide stringent constraints or a smoking-gun signature for dark matter self-interactions.
      The potential detection of a neutron star with surface temperatures $\sim (1000 - 1200)$ K in the optically thin limit
      can push the bounds on asymmetric dark matter self-interaction cross-section to approximately two orders of magnitude
      more stringent than the bullet cluster.
- date: '2026-06-18'
  papers:
  - link: https://arxiv.org/pdf/2606.17132
    comment: Interesting method for determining whether the neutrino is a Dirac or Majorana fermion
    title: Are neutrinos Majorana? Fixed-target and high-energy astrophysical searches decide
    authors: Gabriela Barenboim, Mauricio Bustamante, Qinrui Liu
    affiliations: Valencia U.; Bohr Inst.; Perimeter Inst. Theor. Phys.; Simon Fraser U.; Queen's U., Kingston
    abstract: Determining whether the neutrino is a Dirac or Majorana fermion remains a fundamental open question. Conventional
      searches rely on neutrinoless double beta decay, but this electron-only channel suffers from blind spots. We propose
      a new, complementary probe to overcome this limitation. A heavy neutral lepton (HNL) triggers a high-energy shift in
      how the active neutrino flavors ($ν_e$, $ν_μ$, $ν_τ$) mix -- but only if the neutrinos are Majorana. For GeV-scale HNLs,
      the upcoming beam-dump experiment SHiP can discover the HNL and measure how it mixes with the active flavors. Separately,
      the scattering of TeV--PeV astrophysical neutrinos can resolve the HNL, revealing a shift in the proportions of each
      flavor arriving at Earth that could be detected by neutrino telescopes, regardless of the unknown flavor composition
      at the astrophysical neutrino sources. Because this flavor shift is most sensitive to the muon and tau sectors, it bypasses
      the blind spots of neutrinoless double beta decay. A correlated signal at SHiP and next-generation neutrino telescopes
      would prove that neutrinos are Majorana; its absence would point to them being Dirac.
